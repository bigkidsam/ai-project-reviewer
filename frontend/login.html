<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — AI Project Reviewer</title>
    <meta name="description" content="Sign in to your AI Project Reviewer account or launch instant demo mode." />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <style>
      .auth-container {
        max-width: 440px;
        margin: 40px auto 60px;
      }
      .auth-header {
        text-align: center;
        margin-bottom: var(--space-6);
      }
      .auth-header-icon {
        font-size: 2.5rem;
        margin-bottom: var(--space-2);
        display: inline-block;
      }
      .password-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .password-toggle-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: var(--color-text-muted);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 4px;
        line-height: 1;
        transition: color var(--transition-fast);
      }
      .password-toggle-btn:hover {
        color: var(--color-text);
      }
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: var(--space-6) 0;
        color: var(--color-text-muted);
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid var(--color-border);
      }
      .divider span {
        padding: 0 var(--space-3);
      }
      .demo-btn {
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
        border: 1px solid rgba(6, 182, 212, 0.4);
        color: var(--color-text);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: 12px 20px;
        font-weight: 600;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
      }
      .demo-btn:hover {
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.35) 0%, rgba(59, 130, 246, 0.35) 100%);
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <!-- Ambient Aurora Background -->
    <div class="aurora-bg">
      <div class="aurora-orb aurora-orb-1"></div>
      <div class="aurora-orb aurora-orb-2"></div>
      <div class="aurora-orb aurora-orb-3"></div>
    </div>

    <nav class="nav" id="main-nav"></nav>

    <main class="container page">
      <div class="auth-container" data-animate>
        <!-- Header -->
        <div class="auth-header">
          <span class="auth-header-icon">🔒</span>
          <h1 class="page-title" style="margin-bottom: 4px;">Welcome Back</h1>
          <p class="page-subtitle">Sign in to your account or launch instant demo mode.</p>
        </div>

        <!-- Auth Tabs -->
        <div class="tabs" style="margin-bottom: var(--space-6);">
          <button class="tab-btn active" data-tab="login" id="tab-login-btn">Sign In</button>
          <button class="tab-btn" data-tab="register" id="tab-register-btn">Create Account</button>
        </div>

        <!-- Notification Alert -->
        <div id="auth-alert" class="alert hidden mb-4"></div>

        <!-- 1. Sign In Form -->
        <div class="tab-content active" id="tab-login">
          <div class="card glass-card">
            <div class="card-body">
              <form id="login-form">
                <div class="form-group">
                  <label class="form-label" for="login-username">Username or Email</label>
                  <input
                    type="text"
                    id="login-username"
                    class="form-input"
                    placeholder="Enter your username or email"
                    required
                  />
                </div>

                <div class="form-group">
                  <div class="flex-between">
                    <label class="form-label" for="login-password">Password</label>
                  </div>
                  <div class="password-input-wrap">
                    <input
                      type="password"
                      id="login-password"
                      class="form-input"
                      placeholder="••••••••"
                      required
                    />
                    <button type="button" class="password-toggle-btn" data-target="login-password">👁️</button>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; margin-top: var(--space-4);">
                  🔑 Sign In
                </button>
              </form>

              <div class="divider">
                <span>OR EASY ACCESS</span>
              </div>

              <!-- Quick Demo Login -->
              <button type="button" class="demo-btn" id="demo-login-btn">
                ⚡ One-Click Demo Guest Login
              </button>
            </div>
          </div>
        </div>

        <!-- 2. Create Account Form -->
        <div class="tab-content" id="tab-register">
          <div class="card glass-card">
            <div class="card-body">
              <form id="register-form">
                <div class="form-group">
                  <label class="form-label" for="reg-username">Username</label>
                  <input
                    type="text"
                    id="reg-username"
                    class="form-input"
                    placeholder="Choose a username"
                    required
                    minlength="3"
                  />
                </div>

                <div class="form-group">
                  <label class="form-label" for="reg-email">Email Address</label>
                  <input
                    type="email"
                    id="reg-email"
                    class="form-input"
                    placeholder="you@example.com"
                    required
                  />
                </div>

                <div class="form-group">
                  <label class="form-label" for="reg-password">Password</label>
                  <div class="password-input-wrap">
                    <input
                      type="password"
                      id="reg-password"
                      class="form-input"
                      placeholder="At least 6 characters"
                      required
                      minlength="6"
                    />
                    <button type="button" class="password-toggle-btn" data-target="reg-password">👁️</button>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary" id="register-submit-btn" style="width: 100%; margin-top: var(--space-4);">
                  ✨ Create Free Account
                </button>
              </form>
            </div>
          </div>
        </div>

      </div>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
